name: Testes

# O motor tem de reproduzir as 30.400 linhas da matriz do Excel a cada commit.
# Nada aqui vai à rede: o teste do coletor roda sobre snapshot versionado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Inclui `test_reconstrucao.py`, que refaz as três tabelas fato a partir
      # do canônico e compara com os parquets versionados — a prova de que a
      # camada derivada é mesmo derivada.
      - name: Testes
        run: pytest -q
