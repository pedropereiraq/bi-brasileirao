name: Coleta e recálculo

# Coleta a edição corrente, reconstrói o banco inteiro, confere contra a
# classificação oficial e versiona o resultado. A publicação do site entra
# neste mesmo fluxo na fase 2.
#
# Roda em runner self-hosted, e não na nuvem, porque Sofascore e ogol recusam
# IP de datacenter — medido nos dois lugares, ver docs/decisoes.md seção 1.
# Os testes seguem em runner hospedado: eles não vão à rede.
#
# Os passos são em PowerShell, não em bash: o runner é Windows e o `bash.exe`
# do Git não está no PATH da máquina. Sem `pwsh` instalado, o shell é o
# Windows PowerShell 5.1 — daí não haver `&&` nem operador ternário aqui.
on:
  schedule:
    # Horários em UTC. O Brasil está em UTC-3.
    - cron: "0 6 * * *"   # 03:00 de Brasília — depois dos jogos da noite
    - cron: "0 15 * * *"  # 12:00 de Brasília — rede de segurança
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano da edição a coletar (vazio = ano corrente)"
        required: false
        type: string

concurrency:
  # Duas coletas simultâneas brigariam pelo push. A segunda espera.
  group: coleta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: [self-hosted, windows, casa]
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      # Sem `setup-python`: usa o Python da máquina, que é onde as fontes
      # respondem e onde as dependências já estão instaladas.
      - name: Conferir o ambiente
        run: |
          python --version
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -c "import pandas, pyarrow, curl_cffi, lxml; print('dependencias ok')"

      - name: Definir o ano da edição
        id: edicao
        run: |
          $ano = "${{ inputs.ano }}"
          if ([string]::IsNullOrWhiteSpace($ano)) { $ano = (Get-Date).Year }
          "ano=$ano" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Coletando a edicao de $ano"

      - name: Coletar
        id: coleta
        run: python -m bi coletar --ano ${{ steps.edicao.outputs.ano }}

      - name: Reconstruir o banco
        run: python -m bi construir

      - name: Conferir contra a classificação oficial
        run: python -m bi conferir --ano ${{ steps.edicao.outputs.ano }}

      - name: Rodar os testes do motor
        run: python -m pytest -q

      - name: Versionar o que mudou
        run: |
          git config user.name  "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Nada mudou desde a ultima coleta."
            exit 0
          }
          $carimbo = Get-Date -Format "dd/MM/yyyy HH:mm"
          git commit -m "dados: coleta de $carimbo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push
          exit $LASTEXITCODE

      - name: Diagnóstico da falha de coleta
        if: failure() && steps.coleta.outcome == 'failure'
        run: |
          Write-Output "::error::A coleta falhou. Se a mensagem traz HTTP 403, a fonte"
          Write-Output "::error::recusou o cliente. Rode 'python -m ferramentas.diagnostico_fontes'"
          Write-Output "::error::na maquina para ver o que ainda responde. Ver docs/decisoes.md."
