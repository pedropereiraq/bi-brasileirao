[project]
name = "bi-brasileirao"
version = "0.1.0"
description = "BI do Campeonato Brasileiro — ECBahiaNumeros / Podcast45"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
